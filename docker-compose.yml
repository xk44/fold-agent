services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8010
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - path: .env
        required: false
    environment:
      - NEOVAX_API_PORT=8010
      - NEOVAX_DATABASE_URL=sqlite:///./data/neovax.db
      - NEOVAX_SPECIES_MODE=demo
      - NEOVAX_SAFETY_PREFLIGHT_ENABLED=true
      - NEOVAX_ALPHAFOLD_DEFAULT_BACKEND=mock
      - NEOVAX_PIPELINE_MODE=mock
    volumes:
      - ./data:/app/data
      - ./audit_logs:/app/audit_logs
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      start_interval: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app/dashboard.py --server.port 8502 --server.address 0.0.0.0 --server.headless true
    ports:
      - "127.0.0.1:8502:8502"
    env_file:
      - path: .env
        required: false
    environment:
      - NEOVAX_DASHBOARD_PORT=8502
      - NEOVAX_API_URL=http://app:8010
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Opt-in Celery worker stack.
  #
  # These services are NOT started by default (`docker compose up`
  # only starts app + dashboard). To enable, run:
  #
  #   docker compose --profile worker up
  #
  # Or start just Redis + the worker:
  #
  #   docker compose --profile worker up redis worker
  #
  # Make sure NEOVAX_CELERY_BROKER_URL and NEOVAX_CELERY_RESULT_BACKEND
  # are set (or rely on NEOVAX_REDIS_URL as fallback) in your .env.
  # When these services are running, background jobs will be dispatched
  # through Celery; otherwise the app falls back to its threadpool.
  # ------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    profiles:
      - worker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    volumes:
      - redis_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - worker
    command: celery -A backend.app.worker worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      - NEOVAX_REDIS_URL=redis://redis:6379/0
      - NEOVAX_CELERY_BROKER_URL=redis://redis:6379/0
      - NEOVAX_CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEOVAX_DATABASE_URL=sqlite:///./data/neovax.db
      - NEOVAX_SPECIES_MODE=demo
      - NEOVAX_SAFETY_PREFLIGHT_ENABLED=true
      - NEOVAX_ALPHAFOLD_DEFAULT_BACKEND=mock
      - NEOVAX_PIPELINE_MODE=mock
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./audit_logs:/app/audit_logs
      - ./artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  redis_data: