[project]
name = "foldagent"
version = "0.1.0-alpha"
description = "Local-first, safety-gated research coordination platform for personalized cancer-vaccine exploration under licensed professional supervision"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "pandas>=2.2.0",
    "biopython>=1.83",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
    "types-PyYAML>=6.0.12",
]
frontend = [
    "streamlit>=1.30.0",
    "py3Dmol>=2.0.0",
]
worker = [
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "skills*"]
exclude = ["frontend*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
    "safety: marks safety gate tests",
    "e2e: marks end-to-end workflow tests",
]