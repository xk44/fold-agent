version: 2

updates:
  # ── Python pip dependencies ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "pydantic*"
          - "python-multipart"
          - "httpx"
          - "httpcore"
      sqlalchemy-stack:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "greenlet"
      data-science:
        patterns:
          - "pandas"
          - "numpy"
          - "biopython"
          - "pyarrow"
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy*"
          - "black"
          - "pre-commit"
          - "coverage"
    ignore:
      # Pin major versions manually; only accept patch/minor auto-bumps
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "celery"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-core:
        patterns:
          - "actions/*"
      codeql:
        patterns:
          - "github/codeql-action*"
      security-scanning:
        patterns:
          - "trufflesecurity/*"
          - "anchore/*"
