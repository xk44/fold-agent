name: ci

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,frontend,worker]'

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run smoke tests
        run: make smoke

      - name: Run maintained lint
        run: make lint-maintained

      - name: Run lint (non-blocking until legacy debt is retired)
        continue-on-error: true
        run: make lint

      - name: Run full test suite
        run: PYTHONPATH=. pytest -q

      - name: Run deployment scaffold tests
        run: PYTHONPATH=. pytest -q backend/tests/test_deployment_scaffold.py backend/tests/test_ci_precommit_scaffold.py backend/tests/test_lint_maintained_scaffold.py backend/tests/test_port_consistency.py
